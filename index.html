<!DOCTYPE html>
<html>
<head>
    <title>SME AI SaaS Dashboard</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f5f5f5;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
        }

        input {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }

        pre {
            background: #111;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>📊 SME AI SaaS Dashboard</h1>

<div class="card">
    <h3>📁 Upload Financial CSV</h3>
    <input type="file" id="fileInput">
</div>

<div class="card">
    <h3>🏢 Business Quick Input</h3>
    <input type="text" id="businessName" placeholder="Business Name">
    <input type="text" id="industry" placeholder="Industry">
</div>

<div class="card">
    <button onclick="runAnalysis()">🚀 Run AI Analysis</button>
</div>

<div class="card">
    <h3>📊 Result Output</h3>
    <pre id="output">Waiting for analysis...</pre>
</div>

<div class="card">
    <h3>📩 Full Report / Billing</h3>
    <p>For enterprise AI report and full SaaS access:</p>
    <strong>Contact for Billing</strong>
</div>

<script>
function runAnalysis() {

    const file = document.getElementById("fileInput").files[0];
    const business = document.getElementById("businessName").value;
    const industry = document.getElementById("industry").value;

    if (!file && !business) {
        alert("Please upload CSV or enter business data");
        return;
    }

    document.getElementById("output").innerText =
        "Processing via Sextant AI Engine...\n\nStatus: Running simulation";

    // OFFLINE SIMULATION (no backend)
    setTimeout(() => {

        const report = {
            status: "offline simulation",
            business: business,
            industry: industry,
            rows: 3,
            total_revenue: 4500,
            total_expense: 2000,
            net_cashflow: 2500,
            risk_level: "LOW"
        };

        document.getElementById("output").innerText =
            JSON.stringify(report, null, 2);

    }, 1500);
}
</script>

</body>
</html>
