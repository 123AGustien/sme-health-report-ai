name: SaaS Backend CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Run backend sanity test
        run: |
          python -c "from backend.ai_engine import analyze_finances; print('AI engine OK')"

      - name: Run parser test
        run: |
          python -c "from backend.parser import parse_csv; print('Parser OK')"

      - name: Run report test
        run: |
          python -c "from backend.report_generator import generate_report; print('Report engine OK')"
