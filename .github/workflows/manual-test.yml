name: Manual SaaS Test Pipeline

on:
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pandas

      - name: Backend test
        run: |
          python -c "from backend.ai_engine import analyze_finances; print('AI OK')"
