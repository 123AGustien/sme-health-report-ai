name: Sextant CSV Engine

on:
  workflow_dispatch:
    inputs:
      filename:
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run CSV Engine
        run: |
          python - <<EOF
          import pandas as pd
          import json

          file = "${{ github.event.inputs.filename }}"

          df = pd.read_csv(file)

          revenue = df["revenue"].sum() if "revenue" in df.columns else 0
          expense = df["expense"].sum() if "expense" in df.columns else 0

          net = revenue - expense

          risk = "LOW"
          if net < 0:
              risk = "HIGH"
          elif expense > revenue * 0.7:
              risk = "MEDIUM"

          report = {
              "rows": len(df),
              "total_revenue": float(revenue),
              "total_expense": float(expense),
              "net_cashflow": float(net),
              "risk_level": risk,
              "status": "processed via GitHub Actions"
          }

          # SAVE REPORT FILE (IMPORTANT)
          with open("report.json", "w") as f:
              json.dump(report, f, indent=2)

          print(json.dumps(report, indent=2))
          EOF

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: sextant-report
          path: report.json
