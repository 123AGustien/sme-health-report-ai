name: Sextant CSV Engine

on:
  workflow_dispatch:
    inputs:
      filename:
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run CSV Engine
        run: |
          python - <<EOF
          import pandas as pd
          import json

          file = "${{ github.event.inputs.filename }}"

          df = pd.read_csv(file)

          revenue = df["revenue"].sum() if "revenue" in df else 0
          expense = df["expense"].sum() if "expense" in df else 0

          net = revenue - expense

          risk = "LOW"
          if net < 0:
              risk = "HIGH"
          elif expense > revenue * 0.7:
              risk = "MEDIUM"

          report = {
              "rows": len(df),
              "total_revenue": float(revenue),
              "total_expense": float(expense),
              "net_cashflow": float(net),
              "risk_level": risk,
              "status": "processed via GitHub Actions"
          }

          print(json.dumps(report, indent=2))
          EOF
