name: Sextant CSV Engine

on:
  workflow_dispatch:
    inputs:
      file:
        description: "CSV file name in repo"
        required: true
        default: sample.csv

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ✅ FIX: install dependencies BEFORE running Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Engine
        run: |
          python backend/ai_engine.py "${{ github.event.inputs.file }}"

      - name: Check output files
        run: |
          ls -R

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: sme-business-report
          path: report.json
