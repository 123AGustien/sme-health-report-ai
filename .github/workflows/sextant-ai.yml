name: Sextant CSV Engine

on:
  workflow_dispatch:
    inputs:
      filename:
        required: true
        default: sample.csv

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas

      - name: Run Engine
        run: |
          python backend/ai_engine.py "${{ github.event.inputs.filename }}"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: sextant-report
          path: report.json
